name: Load Test

# Manual load test: boots the API locally, drives k6 against it, and
# fails on threshold breaches (p95 latency, error rate).
# Scheduled runs were removed: they failed every week because nothing
# ever started the server (k6 hit localhost with no app running).

on:
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(locust|pytest)' requirements.txt > /tmp/reqs.txt
          pip install -r /tmp/reqs.txt uvicorn

      - name: Train stub model (CI placeholder)
        run: |
          python - <<'PYEOF'
          import numpy as np
          import pandas as pd
          import joblib
          from pathlib import Path
          from sklearn.linear_model import LogisticRegression
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import Pipeline

          rng = np.random.default_rng(42)
          n = 400
          X = pd.DataFrame({f"V{i}": rng.normal(size=n) for i in range(1, 29)})
          X["Time"] = rng.uniform(0, 172800, n)
          X["Amount"] = rng.exponential(100, n)
          y = rng.choice([0, 1], n, p=[0.95, 0.05])

          pipe = Pipeline([("scaler", StandardScaler()), ("clf", LogisticRegression(max_iter=200))])
          pipe.fit(X, y)
          Path("models").mkdir(exist_ok=True)
          joblib.dump(pipe, "models/best_fraud_model.pkl")
          joblib.dump(pipe.named_steps["scaler"], "models/scaler.pkl")
          Path("models/threshold.txt").write_text("0.5")
          import hashlib
          p = Path("models/best_fraud_model.pkl")
          p.with_suffix(".pkl.sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest())
          print("stub model trained")
          PYEOF

      - name: Start API
        run: |
          JWT_SECRET=ci-secret SECRET_KEY=ci-secret API_KEY=ci-key uvicorn api.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API failed to become healthy within 60s"
          tail -50 uvicorn.log || true
          exit 1

      - name: Prepare results dir
        run: mkdir -p k6-results

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        uses: grafana/run-k6-action@v1
        with:
          path: load-test.js
          flags: --quiet --summary-export=k6-results/summary.json
          env: |
            K6_BASE_URL=http://127.0.0.1:8000

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: k6-results/
