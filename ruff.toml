# Ruff configuration — pins the lint ruleset to the classic defaults
# (E4, E7, E9, F) that this codebase was written and formatted against.
# Without this, newer ruff releases (0.12+) enable many additional rules
# by default and would flag ~145 pre-existing style findings unrelated to
# this project's conventions.
target-version = "py311"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F"]

# Intentional imports-after-code:
# - api/main.py runs setup_structlog() before importing the app modules so
#   logging is configured before any module-level logger is created.
# - src/fraudlens/analysis/eda.py selects the matplotlib Agg backend before
#   importing modules that build figures.
[lint.per-file-ignores]
"api/main.py" = ["E402"]
"src/fraudlens/analysis/eda.py" = ["E402"]
