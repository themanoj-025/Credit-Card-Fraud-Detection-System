[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Pydantic models/settings get accurate synthesized __init__ signatures;
# without this, `Settings()` flags false `call-arg` errors for every field.
# (INI quirk: the pydantic plugin's options section must be named after the
# module itself — [mypy-pydantic.mypy] — or mypy reports it as unused.)
plugins = pydantic.mypy

[mypy-pydantic.mypy]
init_forbid_extra = False
init_typed = True
